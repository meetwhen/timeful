name: Backend CI

on:
  pull_request:
    paths:
      - "server/**"
      - "postgres/**"
      - "mongo/**"
      - "compose*.yaml"
      - ".env.test.example"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "server/**"
      - "postgres/**"
      - "mongo/**"
      - "compose*.yaml"
      - ".env.test.example"
      - ".github/workflows/backend-ci.yml"

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure isolated test environment
        run: cp .env.test.example .env.test

      - name: Validate dual-database Compose configuration
        run: docker compose --env-file .env.test -f compose.yaml -f compose.test.yaml config --quiet

      # Compose never creates external volumes, and the Go build cache is
      # external so `down -v` retains it. Fresh CI runners have no volumes, so
      # create it (idempotent) before any service that mounts it starts,
      # mirroring ensureGoBuildCacheVolume in frontend/e2e/isolated-test-stack.ts.
      - name: Ensure external Go build cache volume exists
        run: docker volume create timeful-test-go-build-cache

      - name: Start MongoDB and PostgreSQL test services
        run: docker compose --env-file .env.test -f compose.yaml -f compose.test.yaml up -d --build mongo-test postgres-test postgres-test-bootstrap postgres-test-migrate

      # Migration completion is enforced by server-route-test's depends_on
      # condition (service_completed_successfully) when compose run starts it.
      # A separate `docker compose wait` step is racy: compose wait lists only
      # running containers, so an already-finished one-shot migrate container
      # makes it fail with "no containers for project".

      - name: Run backend tests
        run: docker compose --env-file .env.test -f compose.yaml -f compose.test.yaml run --rm server-route-test go test ./... -count=1

      - name: Run PostgreSQL browser lifecycle test
        working-directory: frontend
        run: E2E_POSTGRES_ANONYMOUS_EVENT_CREATION_ENABLED=true npm ci && E2E_POSTGRES_ANONYMOUS_EVENT_CREATION_ENABLED=true npm run test:e2e -- --project=firefox-desktop timed-event-postgres-plugin-firefox.spec.ts

      - name: Dump one-shot service logs on failure
        if: failure()
        run: docker compose --env-file .env.test -f compose.yaml -f compose.test.yaml logs postgres-test-bootstrap postgres-test-migrate

      - name: Remove isolated test stack
        if: always()
        run: docker compose --env-file .env.test -f compose.yaml -f compose.test.yaml down -v
