name: Markdown CI

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".github/workflows/markdown-ci.yml"
      - ".prettierrc"
      - "eslint.config.ts"
      - "package.json"
      - "package-lock.json"
      - "scripts/markdown.mjs"
      - "prettier/**/*.js"
      - "prettier/**/*.mjs"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - ".github/workflows/markdown-ci.yml"
      - ".prettierrc"
      - "eslint.config.ts"
      - "package.json"
      - "package-lock.json"
      - "scripts/markdown.mjs"
      - "prettier/**/*.js"
      - "prettier/**/*.mjs"

jobs:
  markdown-quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check Markdown formatting
        run: npm run format:markdown:check

      - name: Lint Markdown
        run: npm run lint:markdown
