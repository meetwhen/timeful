name: Markdown CI

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".github/workflows/markdown-ci.yml"
      - ".prettierrc"
      - "eslint.config.ts"
      - "package.json"
      - "package-lock.json"
      - "scripts/markdown.mjs"
      - "prettier/**/*.js"
      - "prettier/**/*.mjs"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - ".github/workflows/markdown-ci.yml"
      - ".prettierrc"
      - "eslint.config.ts"
      - "package.json"
      - "package-lock.json"
      - "scripts/markdown.mjs"
      - "prettier/**/*.js"
      - "prettier/**/*.mjs"

concurrency:
  group: markdown-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown-quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.5.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check Markdown formatting
        run: npm run format:markdown:check

      - name: Lint Markdown
        run: npm run lint:markdown
