name: timeful-test

services:
  mongo-test:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_test_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  server-test:
    extends:
      file: compose.yaml
      service: server
    build:
      target: builder
    working_dir: /app
    environment:
      MONGODB_URI: mongodb://mongo-test:27017/?serverSelectionTimeoutMS=2000&connectTimeoutMS=2000
      MONGODB_DATABASE: ${MONGODB_DATABASE:?MONGODB_DATABASE is required}
      APP_ENV: ${APP_ENV:-test}
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL is required}
      SESSION_SECRET: "01234567890123456789012345678901"
      GIN_MODE: debug
      CLIENT_SECRET: ""
      MICROSOFT_CLIENT_SECRET: ""
      DISCORD_BOT_TOKEN: ""
      SERVICE_ACCOUNT_KEY_PATH: ""
      SLACK_DEV_WEBHOOK_URL: ""
      SLACK_MONETIZATION_WEBHOOK_URL: ""
      SLACK_PROD_WEBHOOK_URL: ""
      MAILCHIMP_API_KEY: ""
      MAILJET_API_KEY: ""
      MAILJET_API_SECRET: ""
      GMAIL_APP_PASSWORD: ""
      LISTMONK_ENABLED: "false"
      LISTMONK_PASSWORD: ""
      STRIPE_API_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
    ports: !override
      - "127.0.0.1:3003:3003"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3003/api/health"]
    restart: "no"
    volumes: !override
      - ./server:/app
    depends_on: !override
      mongo-test:
        condition: service_healthy
    command: ["go", "run", "."]

  server-route-test:
    build:
      context: ./server
      target: builder
    working_dir: /app
    environment:
      GOCACHE: /tmp/go-cache
      MONGODB_URI: mongodb://mongo-test:27017/?serverSelectionTimeoutMS=2000&connectTimeoutMS=2000
      MONGODB_DATABASE: ${MONGODB_DATABASE:?MONGODB_DATABASE is required}
      ROUTES_READ_FILTERS_TEST_MODE: "compose"
      SESSION_SECRET: "01234567890123456789012345678901"
    volumes:
      - ./server:/app
    command:
      [
        "go",
        "test",
        "./routes",
        "-run",
        "TestGetEventFiltersUnnamedGuestResponses|TestGetResponsesFiltersUnnamedGuestResponses|TestGetResponsesBlindAvailabilityUsesFilteredGuestResponseMap|TestGetEventKeepsSignedInRowsWithBlankStoredResponseName|TestGetEventKeepsLegacyOuterKeySignedInSignUpRows|TestGetResponsesPrefersNewestCanonicalGuestDuplicate",
        "-count=1",
      ]
    depends_on:
      mongo-test:
        condition: service_healthy

volumes:
  mongo_test_data:
