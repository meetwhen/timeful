name: timeful-development

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:18.6-bookworm@sha256:7d2695c3aa88e792e8b3b233e7e4adb296a20412c6c0ca361e3edaaacfada108
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_BOOTSTRAP_USERNAME:-timeful_postgres_admin}
      POSTGRES_PASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD:-timeful_postgres_admin_password}
      POSTGRES_DB: ${POSTGRES_DATABASE:-timeful-postgres-development}
      POSTGRES_MIGRATOR_USERNAME: ${POSTGRES_MIGRATOR_USERNAME:-timeful_migrator}
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:-timeful_migrator_password}
      POSTGRES_APPLICATION_USERNAME: ${POSTGRES_APPLICATION_USERNAME:-timeful_app}
      POSTGRES_APPLICATION_PASSWORD: ${POSTGRES_APPLICATION_PASSWORD:-timeful_app_password}
      POSTGRES_BACKUP_USERNAME: ${POSTGRES_BACKUP_USERNAME:-timeful_backup}
      POSTGRES_BACKUP_PASSWORD: ${POSTGRES_BACKUP_PASSWORD:-timeful_backup_password}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username \"$$POSTGRES_USER\" --dbname \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres-migrate:
    build:
      context: ./server
      target: migrator
    restart: "no"
    environment:
      POSTGRES_MIGRATOR_URI: ${POSTGRES_MIGRATOR_URI:-postgres://timeful_migrator:timeful_migrator_password@postgres:5432/timeful-postgres-development?sslmode=disable}
      POSTGRES_APPLICATION_USERNAME: ${POSTGRES_APPLICATION_USERNAME:-timeful_app}
    depends_on:
      postgres:
        condition: service_healthy
    command:
      [
        "sh",
        "-ec",
        "goose -dir /migrations postgres \"$$POSTGRES_MIGRATOR_URI\" up && printf '%s\\n' 'GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO :\"application_username\";' 'ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO :\"application_username\";' | psql \"$$POSTGRES_MIGRATOR_URI\" --set=ON_ERROR_STOP=1 --set=application_username=\"$$POSTGRES_APPLICATION_USERNAME\"",
      ]

  frontend-artifacts:
    build:
      context: ./frontend
      target: builder
      args:
        VITE_APP_ENV: ${VITE_APP_ENV:-}
        VITE_POSTHOG_API_KEY: ${VITE_POSTHOG_API_KEY:-}
        VITE_POSTHOG_API_HOST: ${VITE_POSTHOG_API_HOST:-}
        VITE_GOOGLE_CLIENT_ID: ${CLIENT_ID:-}
        VITE_MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
        VITE_ENABLE_SIGN_IN: ${VITE_ENABLE_SIGN_IN:-}
        VITE_ENABLE_FREEMIUM: ${VITE_ENABLE_FREEMIUM:-}
        VITE_ENABLE_RICH_LANDING: ${VITE_ENABLE_RICH_LANDING:-}
        VITE_ENABLE_THIRD_PARTY_SHELL: ${VITE_ENABLE_THIRD_PARTY_SHELL:-}
        VITE_ENABLE_PRIVACY_POLICY: ${VITE_ENABLE_PRIVACY_POLICY:-}
        VITE_FEEDBACK_URL: ${VITE_FEEDBACK_URL:-}
        VITE_SUPPORT_EMAIL: ${VITE_SUPPORT_EMAIL:-}
        VITE_GITHUB_REPO_URL: ${VITE_GITHUB_REPO_URL:-}
    volumes:
      - frontend_dist:/app/dist
    command:
      [
        "sh",
        "-c",
        "find /app/dist -mindepth 1 -maxdepth 1 -exec rm -rf {} + && cp -a /build/. /app/dist/ && test -f /app/dist/index.html && echo 'Frontend artifacts copied'",
      ]

  server:
    build:
      context: ./server
    restart: unless-stopped
    # Base Compose targets the default non-staging server port.
    ports:
      - "127.0.0.1:3002:3002"
    environment:
      APP_ENV: ${APP_ENV:-}
      APP_BASE_URL: ${APP_BASE_URL:-}
      ANALYTICS_PASSWORD: ${ANALYTICS_PASSWORD:-}
      ANALYTICS_USERNAME: ${ANALYTICS_USERNAME:-}
      ANDROID_CLIENT_ID: ${ANDROID_CLIENT_ID:-}
      CLIENT_ID: ${CLIENT_ID:-}
      CLIENT_SECRET: ${CLIENT_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_BOT_CHANNEL: ${DISCORD_BOT_CHANNEL:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      FRONTEND_DIST: /app/frontend/dist
      GIN_MODE: ${GIN_MODE:-release}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      GUILD_ID: ${GUILD_ID:-}
      IOS_CLIENT_ID: ${IOS_CLIENT_ID:-}
      GOOGLE_CLOUD_PROJECT_ID: ${GOOGLE_CLOUD_PROJECT_ID:-timeful}
      GOOGLE_CLOUD_TASKS_LOCATION: ${GOOGLE_CLOUD_TASKS_LOCATION:-us-central1}
      GOOGLE_CLOUD_TASKS_QUEUE: ${GOOGLE_CLOUD_TASKS_QUEUE:-SendReminderEmail}
      LISTMONK_ENABLED: ${LISTMONK_ENABLED:-}
      LISTMONK_FINAL_EMAIL_REMINDER_ID: ${LISTMONK_FINAL_EMAIL_REMINDER_ID:-}
      LISTMONK_INITIAL_EMAIL_REMINDER_ID: ${LISTMONK_INITIAL_EMAIL_REMINDER_ID:-}
      LISTMONK_LIST_ID: ${LISTMONK_LIST_ID:-}
      LISTMONK_OTP_EMAIL_TEMPLATE_ID: ${LISTMONK_OTP_EMAIL_TEMPLATE_ID:-}
      LISTMONK_OTP_FROM_ADDRESS: ${LISTMONK_OTP_FROM_ADDRESS:-}
      LISTMONK_PASSWORD: ${LISTMONK_PASSWORD:-}
      LISTMONK_SECOND_EMAIL_REMINDER_ID: ${LISTMONK_SECOND_EMAIL_REMINDER_ID:-}
      LISTMONK_URL: ${LISTMONK_URL:-}
      LISTMONK_USERNAME: ${LISTMONK_USERNAME:-}
      MAILCHIMP_API_KEY: ${MAILCHIMP_API_KEY:-}
      MAILJET_API_KEY: ${MAILJET_API_KEY:-}
      MAILJET_API_SECRET: ${MAILJET_API_SECRET:-}
      MAILJET_LIST_ID: ${MAILJET_LIST_ID:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-timeful-development}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017}
      POSTGRES_APPLICATION_URI: ${POSTGRES_APPLICATION_URI:-postgres://timeful_app:timeful_app_password@postgres:5432/timeful-postgres-development?sslmode=disable}
      POSTGRES_ANONYMOUS_EVENT_CREATION_ENABLED: ${POSTGRES_ANONYMOUS_EVENT_CREATION_ENABLED:-false}
      POSTGRES_CONNECT_TIMEOUT_SECONDS: ${POSTGRES_CONNECT_TIMEOUT_SECONDS:-10}
      POSTGRES_MAX_CONNS: ${POSTGRES_MAX_CONNS:-10}
      TIMEFUL_EMAIL_ADDRESS: ${TIMEFUL_EMAIL_ADDRESS:-}
      SERVICE_ACCOUNT_KEY_PATH: ${SERVICE_ACCOUNT_KEY_PATH:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      SLACK_DEV_WEBHOOK_URL: ${SLACK_DEV_WEBHOOK_URL:-}
      SLACK_MONETIZATION_WEBHOOK_URL: ${SLACK_MONETIZATION_WEBHOOK_URL:-}
      SLACK_PROD_WEBHOOK_URL: ${SLACK_PROD_WEBHOOK_URL:-}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_LIFETIME_PRICE_ID: ${STRIPE_LIFETIME_PRICE_ID:-}
      STRIPE_LIFETIME_PRICE_ID_2: ${STRIPE_LIFETIME_PRICE_ID_2:-}
      STRIPE_LIFETIME_STUDENT_PRICE_ID: ${STRIPE_LIFETIME_STUDENT_PRICE_ID:-}
      STRIPE_MONTHLY_PRICE_ID: ${STRIPE_MONTHLY_PRICE_ID:-}
      STRIPE_MONTHLY_STUDENT_PRICE_ID: ${STRIPE_MONTHLY_STUDENT_PRICE_ID:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_YEARLY_PRICE_ID: ${STRIPE_YEARLY_PRICE_ID:-}
      STRIPE_YEARLY_STUDENT_PRICE_ID: ${STRIPE_YEARLY_STUDENT_PRICE_ID:-}
    volumes:
      - frontend_dist:/app/frontend/dist:ro
      - server_logs:/app/logs
    depends_on:
      mongo:
        condition: service_healthy
      postgres-migrate:
        condition: service_completed_successfully
      frontend-artifacts:
        condition: service_completed_successfully
    # Staging overrides this to probe the staging-specific port in compose.staging.yaml.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3002/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  mongo_data:
  postgres_data:
  frontend_dist:
  server_logs:
