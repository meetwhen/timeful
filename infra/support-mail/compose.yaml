services:
  stalwart:
    image: stalwartlabs/stalwart:v0.16
    restart: unless-stopped
    ports:
      - "25:25"
      - "993:993"
      - "${STALWART_ADMIN_BIND_HOST:-127.0.0.1}:8080:8080"
    environment:
      STALWART_PUBLIC_URL: ${STALWART_PUBLIC_URL:?STALWART_PUBLIC_URL is required}
      STALWART_RECOVERY_ADMIN: ${STALWART_RECOVERY_ADMIN:?STALWART_RECOVERY_ADMIN is required}
      STALWART_RECOVERY_MODE: ${STALWART_RECOVERY_MODE:-}
    volumes:
      - stalwart-etc:/etc/stalwart
      - stalwart-data:/var/lib/stalwart
      - ./certs:/certs:ro

volumes:
  stalwart-etc:
    name: timeful-support-mail-stalwart-etc
  stalwart-data:
    name: timeful-support-mail-stalwart-data

networks:
  default:
    name: timeful-edge
    external: true